name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @politeshop/app exec playwright install --with-deps chromium

      - run: pnpm exec vp test run

  e2e:
    # Fork PRs can't read secrets
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    env:
      # Required by the app's env schema but unused by the tests
      OPENROUTER_API_KEY: unused

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @politeshop/app exec playwright install --with-deps chromium

      # Each run gets its own database branch, so runs don't share data and a PR's migrations can't leak into others
      - id: expiry
        # Neon deletes the branch by itself if the cleanup step below never runs
        run: echo "at=$(date -u -d '+2 hours' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: neondatabase/create-branch-action@v6
        id: neon
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          parent_branch: ${{ vars.NEON_PARENT_BRANCH }}
          branch_name: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          expires_at: ${{ steps.expiry.outputs.at }}

      - run: pnpm --filter @politeshop/app db:migrate
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}

      - run: pnpm --filter @politeshop/app e2e
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report

      - uses: neondatabase/delete-branch-action@v3
        if: always()
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ steps.neon.outputs.branch_id }}
