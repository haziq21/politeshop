name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @politeshop/app exec playwright install --with-deps chromium

      - run: pnpm exec vp test run

  e2e:
    # Fork PRs can't read secrets
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    # One run at a time, since runs share a database
    concurrency: e2e

    env:
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      # Required by the app's env schema but unused by the tests
      OPENROUTER_API_KEY: unused

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @politeshop/app exec playwright install --with-deps chromium

      - run: pnpm --filter @politeshop/app e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report
